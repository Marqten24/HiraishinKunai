name: Build Hiraishin Kunai

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon -p HiraishinKunai-Forge-1.20.1-source/HiraishinKunai-Forge-1.20.1 build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HiraishinKunai-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
